# FreshPi example: dnsmasq as the network's DHCP and DNS server.
#
# Placeholders: LAN 192.0.2.0/24 on eth0, router 192.0.2.1, FreshPi server (TFTP + HTTP)
# 192.0.2.10, local domain example.net. Replace them with your own values.
# Check syntax with: dnsmasq --test -C dnsmasq.conf

interface=eth0
domain=example.net
local=/example.net/
expand-hosts
dhcp-range=192.0.2.100,192.0.2.199,12h
dhcp-option=option:router,192.0.2.1
dhcp-option=option:dns-server,192.0.2.1

# Network boot. The Pis only need the FreshPi server's IP as their TFTP server; the Pi 3
# boot ROM and the Pi 5 bootloader ignore the boot file name and fetch <serial>/...
# themselves. dhcp-boot=<file>,<server name>,<server address>:
# - server name: sent as DHCP option 66 (TFTP server) to clients that ask for it, as the Pis
#   do, otherwise in the BOOTP server-name field. The tested Pis got the address this way,
#   so put the IP here, not a host name.
# - server address: next-server. Not tested on its own with the Pis; set as well, for
#   clients that only read next-server.
# - file: required. Use a name that doesn't exist on the FreshPi server, so any PC that
#   network-boots from this range gets "file not found" and falls back to its own disk. Not
#   bootcode.bin: that file is in FreshPi's TFTP root, so a PC could download it and try to
#   run it.
dhcp-boot=none,192.0.2.10,192.0.2.10

# Some guides add this vendor option for the Pi 3 ROM. FreshPi has worked without it;
# uncomment only if a Pi 3 never asks the TFTP server for bootcode.bin.
#dhcp-option-force=43,"Raspberry Pi Boot"

# One reservation per Pi: a fixed address and DNS name, so configuration management finds
# the Pi after every reinstall. The name must match FreshPi's pi<model>-<serial>. The MAC is
# the Pi's Ethernet MAC (ip link on the Pi, or this server's DHCP log).
dhcp-host=02:00:00:00:00:51,pi5-1234abcd,192.0.2.51
dhcp-host=02:00:00:00:00:52,pi3-5678ef01,192.0.2.52
