# FreshPi example: proxy DHCP on the FreshPi server, for networks whose DHCP server you can't
# change (e.g. a home router). UNTESTED with FreshPi: the router keeps handing out addresses;
# this dnsmasq only adds the boot information.
#
# Placeholders: LAN 192.0.2.0/24 on eth0, FreshPi server 192.0.2.10 (this host; it also runs
# the TFTP server, so dnsmasq's own TFTP and DNS stay off).
# Check syntax with: dnsmasq --test -C dnsmasq-proxydhcp.conf

port=0
interface=eth0
bind-interfaces
dhcp-range=192.0.2.0,proxy
pxe-service=0,"Raspberry Pi Boot",,192.0.2.10

# In proxy mode there is no reservation: the router decides the Pi's address. Give each Pi a
# reservation and DNS name on the router instead, if it can, so configuration management can
# find it after a reinstall.
