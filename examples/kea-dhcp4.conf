// FreshPi example: ISC Kea as the network's DHCP server. Written from the Kea documentation,
// not yet tested with a Pi.
//
// Placeholders: LAN 192.0.2.0/24 on eth0, router and DNS 192.0.2.1, FreshPi server 192.0.2.10,
// local domain example.net.
// Check syntax with: kea-dhcp4 -t kea-dhcp4.conf
{
  "Dhcp4": {
    "interfaces-config": { "interfaces": [ "eth0" ] },
    "lease-database": { "type": "memfile", "persist": true },
    "valid-lifetime": 43200,
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.0.2.0/24",
        "pools": [ { "pool": "192.0.2.100 - 192.0.2.199" } ],
        // Network boot: the Pis only need the FreshPi server's IP as their TFTP server. The
        // tested Pis (on dnsmasq) got it as DHCP option 66, which they ask for; next-server
        // alone is untested with them, so both are set. They ignore the boot file name and
        // fetch <serial>/... themselves, so none is set: a PC that network-boots from this
        // range gets no boot file and uses its own disk.
        "next-server": "192.0.2.10",
        "option-data": [
          { "name": "tftp-server-name", "data": "192.0.2.10" },
          { "name": "routers", "data": "192.0.2.1" },
          { "name": "domain-name-servers", "data": "192.0.2.1" },
          { "name": "domain-name", "data": "example.net" }
        ],
        // One reservation per Pi, named pi<model>-<serial> like FreshPi does. Kea does not put
        // these names in DNS by itself: add matching A records to your DNS server (or run
        // kea-dhcp-ddns).
        "reservations": [
          { "hw-address": "02:00:00:00:00:51", "ip-address": "192.0.2.51", "hostname": "pi5-1234abcd" },
          { "hw-address": "02:00:00:00:00:52", "ip-address": "192.0.2.52", "hostname": "pi3-5678ef01" }
        ]
      }
    ]
  }
}
